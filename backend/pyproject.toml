[project]
name = "wegek-backend"
version = "2.0.0"
description = "WEGEK v2 — AI 3D render studio: Tripo meshes + Blender scenes baked to a site spec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0", "mypy>=1.11.0"]
# bpy (Blender as a module) is heavy and only needed on the render host:
blender = ["bpy>=4.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.clients", "app.pipeline", "app.blender"]

[tool.ruff]
line-length = 120
target-version = "py311"
# build_scene.py runs inside Blender's python (bpy) with its own conventions
extend-exclude = ["app/blender/build_scene.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = "app/blender/build_scene.py"
