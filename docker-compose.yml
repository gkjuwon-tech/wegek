services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # point the review loop at the renderer service inside the compose network
      RENDERER_URL: http://renderer:8200
    volumes:
      - wegek_data:/app/_data
    ports:
      - "8000:8000"
    restart: unless-stopped

  renderer:
    build: ./renderer
    environment:
      BACKEND_ORIGIN: http://backend:8000
      PORT: "8200"
    depends_on:
      - backend
    restart: unless-stopped

  studio:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  wegek_data:
